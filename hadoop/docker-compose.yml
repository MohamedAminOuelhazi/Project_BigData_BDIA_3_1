services:

  namenode:
    build: .
    image: fraudshield/hadoop:3.4.1
    container_name: fraudshield-namenode
    hostname: namenode

    command:
      - bash
      - -lc
      - |
        if [ ! -d /hadoop/dfs/name/current ]; then
          hdfs namenode -format -force -nonInteractive
        fi
        exec hdfs namenode

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode_data:/hadoop/dfs/name

    networks:
      - fraudshield-network

    restart: unless-stopped

  datanode:
    image: fraudshield/hadoop:3.4.1
    container_name: fraudshield-datanode
    hostname: datanode

    command:
      - bash
      - -lc
      - |
        until hdfs dfs -ls / >/dev/null 2>&1; do
          sleep 3
        done
        exec hdfs datanode

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/hadoop/dfs/data

    depends_on:
      - namenode

    networks:
      - fraudshield-network

    restart: unless-stopped



  spark-master:
    image: spark:3.5.8-java17-python3
    container_name: fraudshield-spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "7077:7077"
      - "8082:8080"

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf

    volumes:
      - ./config:/opt/hadoop-conf:ro
      - ../spark/jobs:/opt/spark-apps

    depends_on:
      - namenode
      - datanode

    networks:
      - fraudshield-network

    restart: unless-stopped

  spark-worker:
    image: spark:3.5.8-java17-python3
    container_name: fraudshield-spark-worker
    hostname: spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "2G"

    ports:
      - "8081:8081"

    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf

    volumes:
      - ./config:/opt/hadoop-conf:ro

    depends_on:
      - spark-master

    networks:
      - fraudshield-network

    restart: unless-stopped

  pig:
    build:
      context: ./pig
      dockerfile: Dockerfile
    container_name: fraudshield-pig

    hostname: pig

    volumes:
      - ./config:/opt/hadoop/etc/hadoop:ro
      - ./pig/scripts:/workspace/scripts
      - ./pig/output:/workspace/output

    networks:
      - fraudshield-network

    depends_on:
      - namenode

    stdin_open: true
    tty: true


  hive:
    build:
      context: ./hive
      dockerfile: Dockerfile
    image: fraudshield/hive:4.0.1
    container_name: fraudshield-hive
    hostname: hive
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_CONF_DIR: /opt/hive/conf/hadoop
    volumes:
      - ./config:/opt/hive/conf/hadoop:ro
    depends_on:
      - namenode
    networks:
      - fraudshield-network
    restart: unless-stopped


volumes:
  namenode_data:
  datanode_data:

networks:
  fraudshield-network:
    driver: bridge


